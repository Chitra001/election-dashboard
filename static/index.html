<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Eklection • West Bengal Verdict 2026 | Live Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #f5f9ff 0%, #eef2f8 100%); color: #0a2540; }
        .site-header { background: rgba(10,37,64,0.92); backdrop-filter: blur(12px); color: white; padding: 0.9rem 2rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; border-bottom: 1px solid rgba(255,255,255,0.2); position: sticky; top: 0; z-index: 100; }
        .logo h1 { font-weight: 800; font-size: 1.9rem; background: linear-gradient(135deg, #FFF9C4, #FFE6A3); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .live-badge { background: #c2410c; padding: 8px 18px; border-radius: 40px; font-weight: 600; font-size: 0.85rem; display: flex; align-items: center; gap: 8px; box-shadow: 0 0 8px rgba(194,65,12,0.5); }
        .fa-circle { font-size: 0.65rem; animation: pulse 1.2s infinite; }
        @keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }
        .container { max-width: 1400px; margin: 0 auto; padding: 1.8rem 1.5rem; }
        .party-strip { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; margin-bottom: 2rem; }
        .party-card { background: rgba(255,255,255,0.85); backdrop-filter: blur(4px); border-radius: 1.8rem; padding: 0.7rem 1.6rem; min-width: 110px; text-align: center; box-shadow: 0 6px 14px rgba(0,0,0,0.05); border-bottom: 3px solid; transition: transform 0.2s; }
        .party-card h4 { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; }
        .party-card .seat-count { font-size: 2rem; font-weight: 800; line-height: 1.2; }
        .constituency-spotlight { background: white; border-radius: 2rem; box-shadow: 0 25px 45px -12px rgba(0,0,0,0.25); overflow: hidden; margin-bottom: 2rem; }
        .spotlight-header { background: linear-gradient(98deg, #0f2c3f 0%, #1b4a6e 100%); padding: 1.2rem 2rem; display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; color: white; }
        .const-name { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.3px; }
        .const-badge { background: #ffb347; padding: 5px 16px; border-radius: 60px; font-weight: 700; color: #1e2f3e; font-size: 0.9rem; }
        .timer-bar { background: #eef2f7; height: 6px; width: 100%; }
        .timer-progress { width: 0%; height: 6px; background: linear-gradient(90deg, #f59e0b, #dc2626); transition: width linear; }
        .candidates-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 1.2rem; padding: 2rem; background: #ffffff; }
        .candidate-card { background: #f9fbfe; border-radius: 1.5rem; display: flex; align-items: center; gap: 1rem; padding: 1rem 1.2rem; transition: all 0.25s; border: 1px solid #eef2f9; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
        .candidate-card:hover { transform: translateY(-3px); background: white; border-color: #cbdff2; box-shadow: 0 12px 20px -10px rgba(0,0,0,0.1); }
        .candidate-img { width: 70px; height: 70px; border-radius: 50%; background: #d9e2ef; overflow: hidden; border: 2px solid #f3b33d; flex-shrink: 0; }
        .candidate-img img { width: 100%; height: 100%; object-fit: cover; }
        .candidate-info { flex: 1; }
        .candidate-name { font-weight: 800; font-size: 1.1rem; }
        .candidate-party { font-size: 0.75rem; font-weight: 600; color: #2c5f8a; margin-top: 2px; }
        .vote-detail { font-size: 0.85rem; font-weight: 700; margin-top: 6px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .status-lead { background: #e9f4e9; padding: 2px 10px; border-radius: 20px; color: #1f6e43; }
        .status-trail { background: #ffe8e6; color: #b91c1c; padding: 2px 10px; border-radius: 20px; }
        .control-panel { background: white; border-radius: 2rem; padding: 1rem 2rem; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem; box-shadow: 0 5px 12px rgba(0,0,0,0.05); }
        .search-group { flex: 2; min-width: 250px; position: relative; }
        .search-input { width: 100%; padding: 12px 18px; border-radius: 60px; border: 1px solid #ddd; font-family: inherit; font-size: 0.9rem; background: white; }
        .btn-reset { background: #1e3a5f; border: none; padding: 8px 20px; border-radius: 40px; color: white; font-weight: 600; cursor: pointer; white-space: nowrap; }
        footer { text-align: center; padding: 2rem; font-size: 0.75rem; color: #5a6e7c; }
        @media (max-width: 700px) { .const-name { font-size: 1.4rem; } .candidates-grid { padding: 1rem; } .control-panel { flex-direction: column; align-items: stretch; } .search-group { width: 100%; } }
        .placeholder { text-align: center; padding: 2rem; color: #6c757d; background: #f8f9fa; border-radius: 1rem; }
        datalist { background: white; border-radius: 1rem; }
    </style>
</head>
<body>
<header class="site-header">
    <div class="logo"><h1>🗳️ EKLECTION <span>live · verdict 2026</span></h1></div>
    <div class="live-badge"><i class="fas fa-circle"></i> LIVE COUNTING · IST CYCLE</div>
</header>
<div class="container">
    <div class="party-strip" id="partySummaryPanel">Loading party totals...</div>
    <div class="constituency-spotlight">
        <div class="spotlight-header">
            <div class="const-name" id="constName">Initialising...</div>
            <div class="const-badge" id="constExtras">AC --</div>
        </div>
        <div class="timer-bar"><div class="timer-progress" id="timerProgress"></div></div>
        <div class="candidates-grid" id="dynamicCandidatesGrid">Waiting for data...</div>
    </div>
    <div class="control-panel">
        <div><i class="fas fa-chart-line"></i> <strong>Constituency navigator</strong></div>
        <div class="search-group">
            <input list="constituencyList" id="searchInput" class="search-input" placeholder="🔍 Type constituency name or AC number..." autocomplete="off">
            <datalist id="constituencyList"></datalist>
        </div>
        <div class="info-note"><i class="fas fa-sync-alt"></i> Auto-cycle 15s · IST aligned</div>
        <button id="resetRotationBtn" class="btn-reset"><i class="fas fa-redo-alt"></i> Next constituency</button>
    </div>
</div>
<footer>© Eklection 2026 · Real-time data from ECI | West Bengal - 294 Assembly Constituencies</footer>

<script>
    // ---------- CONFIG ----------
    const SLIDE_SEC = 15;
    const REFRESH_MS = 60000;
    const BASE_TIME_IST = new Date(Date.UTC(2026, 4, 4, 4, 30, 0)); // 10:00 IST

    let allConstituencies = [];     // full list sorted by ac_no
    let currentIndex = 0;
    let slideInterval = null;
    let refreshInterval = null;
    let progressAnimation = null;
    let autoCycle = true;

    function getISTNow() {
        const now = new Date();
        const offsetIST = 5.5 * 60 * 60 * 1000;
        return new Date(now.getTime() + (offsetIST - now.getTimezoneOffset() * 60 * 1000));
    }

    function computeStartIndex() {
        if (!allConstituencies.length) return 0;
        const elapsedSec = (getISTNow() - BASE_TIME_IST) / 1000;
        if (elapsedSec < 0) return 0;
        return Math.floor(elapsedSec / SLIDE_SEC) % allConstituencies.length;
    }

    async function fetchJSON(url) {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.json();
    }

    async function loadPartyTotals() {
        try {
            const data = await fetchJSON('/api/party-totals');
            const container = document.getElementById('partySummaryPanel');
            if (data.parties && data.parties.length) {
                container.innerHTML = data.parties.map(p => `
                    <div class="party-card" style="border-bottom-color: ${p.color};">
                        <h4>${escapeHtml(p.name)}</h4>
                        <div class="seat-count">${p.seats}</div>
                        <div>seats</div>
                    </div>
                `).join('');
            }
        } catch(e) {
            console.error('Party totals error', e);
            document.getElementById('partySummaryPanel').innerHTML = '<div class="placeholder">⚠️ Party totals unavailable</div>';
        }
    }

    async function loadConstituencyList() {
        try {
            const data = await fetchJSON('/api/constituencies');
            allConstituencies = data.constituencies.sort((a,b) => a.ac_no - b.ac_no);
            if (!allConstituencies.length) throw new Error('Empty list');
            buildDatalist();
            currentIndex = computeStartIndex();
            await loadCurrentConstituency();
            startRotation();
            setupSearchListener();
        } catch(e) {
            console.error('Constituency list error', e);
            document.getElementById('constName').innerHTML = 'Failed to load constituency list.';
        }
    }

    async function loadCurrentConstituency() {
        if (!allConstituencies.length) return;
        const constObj = allConstituencies[currentIndex];
        try {
            const data = await fetchJSON(`/api/constituency/${constObj.code}`);
            displayConstituency(constObj, data);
        } catch(e) {
            console.error('Load error', constObj.code, e);
            document.getElementById('constName').innerHTML = constObj.name;
            document.getElementById('constExtras').innerHTML = `AC ${constObj.ac_no} • Error loading`;
            document.getElementById('dynamicCandidatesGrid').innerHTML = '<div class="placeholder">⚠️ Failed to fetch data</div>';
        }
    }

    function displayConstituency(constObj, data) {
        document.getElementById('constName').innerHTML = constObj.name;
        const roundInfo = data.round_current ? `${data.round_current}/${data.round_total}` : '0/0';
        document.getElementById('constExtras').innerHTML = `AC ${constObj.ac_no} • Round ${roundInfo}`;
        const grid = document.getElementById('dynamicCandidatesGrid');
        if (!data.candidates || data.candidates.length === 0) {
            grid.innerHTML = '<div class="placeholder">📊 Counting not started or no candidate data yet</div>';
            return;
        }
        grid.innerHTML = data.candidates.map(cand => {
            const statusClass = cand.status === 'leading' ? 'status-lead' : 'status-trail';
            const statusText = cand.status === 'leading' ? 'Leading' : 'Trailing';
            let imgSrc = cand.img_src || 'https://placehold.co/70x70?text=No+Image';
            if (imgSrc.startsWith('/')) imgSrc = `https://results.eci.gov.in${imgSrc}`;
            return `
                <div class="candidate-card">
                    <div class="candidate-img"><img src="${imgSrc}" alt="${escapeHtml(cand.name)}" onerror="this.src='https://placehold.co/70x70?text=No+Image'"></div>
                    <div class="candidate-info">
                        <div class="candidate-name">${escapeHtml(cand.name)}</div>
                        <div class="candidate-party"><i class="fas fa-tag"></i> ${escapeHtml(cand.party)}</div>
                        <div class="vote-detail">
                            <span><i class="fas fa-vote-yea"></i> ${cand.votes.toLocaleString()}</span>
                            <span class="${statusClass}">${statusText} ${cand.margin || ''}</span>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function nextSlide() {
        if (!autoCycle) return;
        if (!allConstituencies.length) return;
        currentIndex = (currentIndex + 1) % allConstituencies.length;
        loadCurrentConstituency();
        resetProgressBar();
        // clear search input
        document.getElementById('searchInput').value = '';
    }

    function resetProgressBar() {
        if (progressAnimation) cancelAnimationFrame(progressAnimation);
        const progressEl = document.getElementById('timerProgress');
        if (!progressEl) return;
        progressEl.style.width = '0%';
        const startTime = performance.now();
        function animate(now) {
            const elapsed = (now - startTime) / 1000;
            const percent = Math.min((elapsed / SLIDE_SEC) * 100, 100);
            progressEl.style.width = percent + '%';
            if (elapsed < SLIDE_SEC) {
                progressAnimation = requestAnimationFrame(animate);
            } else {
                progressAnimation = null;
            }
        }
        progressAnimation = requestAnimationFrame(animate);
    }

    function startRotation() {
        if (slideInterval) clearInterval(slideInterval);
        slideInterval = setInterval(() => nextSlide(), SLIDE_SEC * 1000);
        resetProgressBar();
        if (refreshInterval) clearInterval(refreshInterval);
        refreshInterval = setInterval(() => {
            if (autoCycle && allConstituencies.length) {
                loadCurrentConstituency();
                loadPartyTotals();
            }
        }, REFRESH_MS);
    }

    function stopRotation() {
        if (slideInterval) clearInterval(slideInterval);
        if (refreshInterval) clearInterval(refreshInterval);
        if (progressAnimation) cancelAnimationFrame(progressAnimation);
        slideInterval = null;
        refreshInterval = null;
        progressAnimation = null;
    }

    function pauseAuto() {
        autoCycle = false;
        stopRotation();
        const btn = document.getElementById('resetRotationBtn');
        btn.innerHTML = '<i class="fas fa-play"></i> Resume Rotation';
        btn.onclick = () => resumeAuto();
    }

    function resumeAuto() {
        autoCycle = true;
        if (allConstituencies.length) {
            loadCurrentConstituency();
        }
        startRotation();
        const btn = document.getElementById('resetRotationBtn');
        btn.innerHTML = '<i class="fas fa-redo-alt"></i> Next constituency';
        btn.onclick = () => nextSlide();
    }

    function buildDatalist() {
        const datalist = document.getElementById('constituencyList');
        datalist.innerHTML = '';
        allConstituencies.forEach(c => {
            const option = document.createElement('option');
            option.value = `${c.ac_no} - ${c.name}`;
            // store the code as a data attribute for later lookup
            option.setAttribute('data-code', c.code);
            datalist.appendChild(option);
        });
    }

    function setupSearchListener() {
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', async (e) => {
            const selectedText = e.target.value;
            if (!selectedText) return;
            // find matching constituency from our list
            const matched = allConstituencies.find(c => `${c.ac_no} - ${c.name}` === selectedText);
            if (matched) {
                if (autoCycle) pauseAuto();
                currentIndex = allConstituencies.findIndex(c => c.code === matched.code);
                await loadCurrentConstituency();
                // clear input to avoid confusion
                searchInput.value = '';
            }
        });
        // also allow direct enter with partial match? Not needed because datalist forces exact match.
    }

    // ---------- INITIALISE ----------
    (async function init() {
        await loadPartyTotals();
        await loadConstituencyList();
        document.getElementById('resetRotationBtn').onclick = () => nextSlide();
    })();
</script>
</body>
</html>
